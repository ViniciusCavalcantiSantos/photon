# Standalone production stack.
# Copy each .env.production.example to .env.production in its own directory.
# Fill in infrastructure and Laravel settings respectively, then run:
# docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

x-php: &php
  build:
    context: ./server
    dockerfile: docker/Dockerfile
  env_file:
    - path: ${LARAVEL_ENV_FILE:-./server/.env.production}
      required: true
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
    DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    REDIS_PREFIX: ${REDIS_PREFIX:-photon}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
  volumes:
    - app-storage:/var/www/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - main-network
  restart: unless-stopped

services:
  webserver:
    build:
      context: ./server
      dockerfile: docker/nginx/Dockerfile.prod
    ports:
      - "${FORWARD_APP_PORT:-8010}:80"
    depends_on:
      - app
      - sse
    networks:
      - main-network
    restart: unless-stopped

  app:
    <<: *php
    command: sh -c "php artisan config:cache && php artisan view:cache && php-fpm"

  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --timeout=90

  scheduler:
    <<: *php
    command: php artisan schedule:work

  sse:
    build:
      context: ./sse
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
      REDIS_PREFIX: ${REDIS_PREFIX:-photon}
      SSE_PORT: "8080"
      SSE_ALLOWED_ORIGINS: ${SSE_ALLOWED_ORIGINS:?Set SSE_ALLOWED_ORIGINS in .env.production}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - main-network
    restart: unless-stopped

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - main-network
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - main-network
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  app-storage:

networks:
  main-network:
    driver: bridge
